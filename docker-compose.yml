name: sorb
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sorb
      POSTGRES_USER: sorb
      POSTGRES_PASSWORD: sorb_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sorb_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sorb -d sorb"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://sorb:sorb_dev@db:5432/sorb?schema=public
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    profiles: [app]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend: { condition: service_healthy }

volumes:
  sorb_db:
